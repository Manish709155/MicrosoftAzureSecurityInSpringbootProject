spring:
  application:
    name: Microsoft-Azure-Security-In-Springboot-Project

  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID}
        credential:
          client-id: ${AZURE_CLIENT_ID}
          client-secret: ${AZURE_CLIENT_SECRET}

server:
  port: 9191
  forward-headers-strategy: native